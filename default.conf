# RAMA health-path-failing: / sirve el sitio como en main, pero /healthz
# responde 500. La usa la prueba de REQ-0057 en Hexaplane (tests/conformance/
# app_health_path_test.go) como la version que abre el puerto y falla en su
# ruta de salud: para una sonda TCP esta sana, para la ruta declarada no.
#
# Sustituye al default.conf de la base y conserva su puerto 8080: sin root, por
# debajo de 1024 no se puede escuchar.
server {
    listen       8080;
    server_name  localhost;

    location = /healthz {
        default_type text/plain;
        return 500 "failing\n";
    }

    location / {
        root   /usr/share/nginx/html;
        index  index.html;
    }
}
