# RAMA health-path-ok: /healthz responde 200, y / sirve el sitio como en main.
# La usa la prueba de REQ-0057 en Hexaplane (tests/conformance/
# app_health_path_test.go) como la version sana de una App que declara
# serve.healthCheck.path: /healthz.
#
# Sustituye al default.conf de la base y conserva su puerto 8080: sin root, por
# debajo de 1024 no se puede escuchar.
server {
    listen       8080;
    server_name  localhost;

    location = /healthz {
        default_type text/plain;
        return 200 "ok\n";
    }

    location / {
        root   /usr/share/nginx/html;
        index  index.html;
    }
}
